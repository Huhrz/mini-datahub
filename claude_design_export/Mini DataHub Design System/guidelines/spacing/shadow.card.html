<!-- @dsCard group="Spacing" viewport="700x150" name="Shadow scale" subtitle="sm (card) · md (hover) · 2xl (drawer)" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:24px;background:var(--surface-sunken);display:flex;gap:24px;align-items:center">
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-sm)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:8px">sm</div></div>
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-md)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:8px">md</div></div>
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-lg)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:8px">lg</div></div>
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-2xl)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:8px">2xl</div></div>
