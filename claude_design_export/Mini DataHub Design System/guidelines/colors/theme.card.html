<!-- @dsCard group="Colors" viewport="700x260" name="Light / dark theme" subtitle="Toggle data-theme=\"dark\" on any ancestor — semantics repoint" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;padding:16px;background:var(--gray-100)">
  <div style="flex:1;background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:12px;padding:16px;font-family:var(--font-sans)">
    <div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin-bottom:10px">Light</div>
    <div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:10px;padding:12px;box-shadow:var(--shadow-sm)">
      <div style="font-weight:700;color:var(--text-primary);font-size:15px">ALOHA Sim Insertion</div>
      <div style="color:var(--text-secondary);font-size:12px;margin-top:2px">bimanual · lerobot_v3</div>
      <span style="display:inline-block;margin-top:8px;background:var(--tone-accent-bg);color:var(--tone-accent-fg);font-size:11px;padding:3px 8px;border-radius:6px">质量 0.91</span>
    </div>
  </div>
  <div data-theme="dark" style="flex:1;background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:12px;padding:16px;font-family:var(--font-sans)">
    <div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin-bottom:10px">Dark</div>
    <div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:10px;padding:12px;box-shadow:var(--shadow-sm)">
      <div style="font-weight:700;color:var(--text-primary);font-size:15px">ALOHA Sim Insertion</div>
      <div style="color:var(--text-secondary);font-size:12px;margin-top:2px">bimanual · lerobot_v3</div>
      <span style="display:inline-block;margin-top:8px;background:var(--tone-accent-bg);color:var(--tone-accent-fg);font-size:11px;padding:3px 8px;border-radius:6px">质量 0.91</span>
    </div>
  </div>
</div>
