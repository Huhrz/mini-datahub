<!-- @dsCard group="Colors" viewport="700x120" name="Surfaces & borders" subtitle="Page / card / sunken / border hierarchy" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:16px;background:var(--surface-page);display:flex;gap:10px">
  <div style="flex:1;background:var(--surface-page);border:1px solid var(--border-default);border-radius:8px;padding:10px;font-size:12px;color:var(--text-secondary);text-align:center">page</div>
  <div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;padding:10px;font-size:12px;color:var(--text-secondary);text-align:center;box-shadow:var(--shadow-sm)">card</div>
  <div style="flex:1;background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:8px;padding:10px;font-size:12px;color:var(--text-secondary);text-align:center">sunken</div>
  <div style="flex:1;background:var(--surface-inverse);border-radius:8px;padding:10px;font-size:12px;color:var(--text-on-inverse);text-align:center">inverse</div>
</div>
